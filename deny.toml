# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-Bridge 用に調整
#
# ALICE-Bridge は AGPL-3.0-or-later のため自己 exception 必須 (下部 [[licenses.exceptions]])
# sibling path dep は 0 (alice-stubs は no-op)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.15 unmaintained (pyo3-macros / bytemuck transitive)
    "RUSTSEC-2024-0436",
    # bincode 2.x unmaintained (postcard 移行コスト高)
    "RUSTSEC-2025-0141",
    # ttf-parser unmaintained (font 描画系 transitive、alice-bridge 直接無使用だが transitive 出現時 guard)
    "RUSTSEC-2026-0192",
    # crossbeam-epoch (safety keep, should be fixed by cargo update)
    "RUSTSEC-2026-0204",
    # pyo3 系 unmaintained (transitive)
    "RUSTSEC-2025-0020",
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
    # rustls chain CVE (0.102.8 → 0.103+ upgrade pending upstream deps)
    "RUSTSEC-2025-0134",  # rustls-webpki reachable panic
    "RUSTSEC-2026-0049",  # rustls-pemfile unmaintained
    "RUSTSEC-2026-0098",  # rustls-webpki CRL matching logic
    "RUSTSEC-2026-0099",  # rustls-webpki URI name constraints
    "RUSTSEC-2026-0104",  # rustls-webpki wildcard name constraints
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (transitive font-lib 経由)
    "OFL-1.1",           # SIL Open Font License (Ubuntu Mono / Noto 等)
    "Ubuntu-font-1.0",   # Ubuntu Font License
    # LLVM ecosystem
    "NCSA",              # libfuzzer-sys / LLVM related
    # Community Data License
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ALICE-Bridge 自己 exception (AGPL-3.0-or-later は allow-list 外だが自プロジェクトのみ許可)
[[licenses.exceptions]]
name = "alice-bridge"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
